[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "human-alignment"
version = "0.1.0"
description = "Load and smoke-test released AligNet vision checkpoints"
requires-python = ">=3.12,<3.14"
dependencies = [
  "tensorflow[and-cuda]>=2.20,<2.21",
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "Pillow>=10,<13",
  "opencv-python-headless>=4.10,<5",
]

[project.scripts]
alignment-smoke = "human_alignment.smoke:main"
alignment-navon = "human_alignment.navon:main"

[tool.setuptools.packages.find]
where = ["src"]
